[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "patchwait"
version = "0.2.0"
description = "Inventory runtimes bundled in Windows applications and track items waiting on a vendor fix."
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[project.scripts]
patchwait = "patchwait.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pyright]
include = ["src", "tests", "tools"]
extraPaths = ["src"]
pythonVersion = "3.11"
typeCheckingMode = "standard"
strict = ["src"]
